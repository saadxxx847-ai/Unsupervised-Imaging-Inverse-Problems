# @package _global_

defaults:
 - /dataset@dataset.test: bdd100k_noisy_patch
 - override /training: validation
 - override /loss: deepinv

dataset:
  test:
    full_image: true

loss:
  crop_filters: 1
  patch_size: 128
  padding: 32
  patch_batch_size: 512

models:
  deepinv_solver:
    method: dpir
    prior: DRUNet
  kernel:
    path: null  # injected only after independent Step 2 verification

training:
  batch_size: 1
  num_workers: 0
  report_every_steps: 8
  plot_every_steps: 8
  save_eval_to_file: true
  save_pred_only: true
  require_output_manifest: true

exp_name: bdd100k_step3
